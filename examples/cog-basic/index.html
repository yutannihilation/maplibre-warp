<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-cog-warp — COG basic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font: 13px/1.5 system-ui, sans-serif;
      }
      #panel label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      #panel select {
        font: inherit;
        width: 100%;
      }
      #status {
        margin-top: 8px;
        color: #444;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <label for="dataset">Dataset</label>
      <select id="dataset"></select>
      <div id="status">loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>maplibre-warp — COG basic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 10px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font: 13px/1.5 system-ui, sans-serif;
      }
      #panel label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      #panel select {
        font: inherit;
        width: 100%;
        margin-bottom: 8px;
      }
      #contour-controls {
        margin: 0 0 8px;
        padding: 6px 8px 2px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 4px;
      }
      #contour-controls legend {
        padding: 0 4px;
        font-weight: 600;
      }
      #contour-controls output {
        float: right;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      #contour-controls input[type="range"] {
        display: block;
        width: 100%;
        margin: 0 0 8px;
      }
      #status {
        margin-top: 8px;
        color: #444;
        white-space: pre-line;
      }
      #legend {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 14px auto;
        gap: 2px 8px;
        align-items: center;
        max-height: 40vh;
        overflow-y: auto;
      }
      #legend:empty {
        display: none;
      }
      #legend i {
        display: block;
        width: 14px;
        height: 14px;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <label for="dataset">Dataset</label>
      <select id="dataset"></select>
      <label for="projection">Projection</label>
      <select id="projection">
        <option value="mercator">mercator</option>
        <option value="globe">globe (mercator above z12)</option>
        <option value="vertical-perspective">vertical-perspective</option>
      </select>
      <fieldset id="contour-controls" hidden>
        <legend>Contours</legend>
        <label for="scheme">Colour scheme</label>
        <select id="scheme"></select>
        <label for="bins">Bins <output for="bins" id="bins-value"></output></label>
        <input id="bins" type="range" step="1" />
      </fieldset>
      <div id="status">loading…</div>
      <div id="legend"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
